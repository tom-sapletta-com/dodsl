[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dodsl-core"
version = "0.2.0"
description = "Workspace runtime and ports for doDSL"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["dodsl-contracts==0.2.0"]

[tool.setuptools.packages.find]
where = ["src"]
