[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dodsl-planning"
version = "0.2.3"
description = "Governed artifact and research planning for doDSL"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["dodsl-contracts>=0.2,<0.3", "dodsl-core>=0.2,<0.3"]

[tool.setuptools.packages.find]
where = ["src"]
