[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dodsl-planning"
version = "0.1.0"
description = "Governed artifact and research planning for doDSL"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["dodsl-contracts==0.1.0", "dodsl-core==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
