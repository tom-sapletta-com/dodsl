[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dodsl-contracts"
version = "0.1.0"
description = "Pure contracts and DSL models for doDSL"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dodsl_contracts = ["schemas/*.json"]
