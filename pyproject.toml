[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dodsl-workspace"
version = "0.2.3"
description = "Monorepo workspace for doDSL packages and services"
requires-python = ">=3.11"
dependencies = ["dodsl>=0.2,<0.3"]
license = "Apache-2.0"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
dodsl = {workspace = true}
dodsl-adapters = {workspace = true}
dodsl-contracts = {workspace = true}
dodsl-core = {workspace = true}
dodsl-planning = {workspace = true}
onlydsl-contracts = {git = "https://github.com/tom-sapletta-com/onlyDSL.git", rev = "f694d1eaa2683c6f7e72064ddb145db9802cc847", subdirectory = "packages/onlydsl-contracts"}
f2md = {git = "https://github.com/bioxfoundry/twin-dsl.git", rev = "c010b499feacb80fcb814be78b07d6a14444ee6f", subdirectory = "py/f2md"}

[dependency-groups]
dev = ["pytest>=9.0,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.costs]
badge = false
update_readme = false

[tool.pfix]
auto_apply = false
auto_install_deps = false
auto_restart = false
max_retries = 0
create_backups = false
git_auto_commit = false

[tool.pfix.runtime_todo]
enabled = false
todo_file = "TODO.md"
min_severity = "error"
deduplicate = true
