[project]
name = "dodsl-workspace"
version = "0.1.0"
description = "Monorepo workspace for doDSL packages and services"
requires-python = ">=3.11"
dependencies = ["dodsl==0.1.0"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
dodsl = {workspace = true}
dodsl-adapters = {workspace = true}
dodsl-contracts = {workspace = true}
dodsl-core = {workspace = true}
dodsl-planning = {workspace = true}
onlydsl-contracts = {git = "https://github.com/tom-sapletta-com/onlyDSL.git", rev = "9d89195", subdirectory = "packages/onlydsl-contracts"}
f2md = {git = "https://github.com/bioxfoundry/twin-dsl.git", rev = "b4bf25d5e1903b0a215d37285becc98ee9b48d50", subdirectory = "py/f2md"}

[dependency-groups]
dev = ["pytest>=9.0,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
