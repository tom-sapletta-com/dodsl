[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dodsl"
version = "0.2.2"
description = "Governed source-to-SSOT-to-artifact orchestration service"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "dodsl-adapters>=0.2,<0.3",
  "dodsl-contracts>=0.2,<0.3",
  "dodsl-core>=0.2,<0.3",
  "dodsl-planning>=0.2,<0.3",
]

[project.scripts]
dodsl = "dodsl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
